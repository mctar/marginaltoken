<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Marginal Token social card</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.48), transparent 360px),
          #fff1e5;
        color: #2b2a28;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 627px;
        padding: 34px 58px 42px;
      }
      .eyebrow {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(43, 42, 40, 0.42);
        padding-bottom: 14px;
        color: #6b645e;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .masthead {
        border-top: 4px double #2b2a28;
        border-bottom: 1px solid #2b2a28;
        padding: 18px 0 22px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.055em;
        line-height: 0.95;
        text-align: center;
      }
      .main {
        display: grid;
        grid-template-columns: 1fr 270px;
        align-items: end;
        gap: 52px;
        height: 322px;
        padding-top: 32px;
      }
      .kicker {
        margin: 0 0 13px;
        color: #990f3d;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.97;
      }
      .mark {
        position: relative;
        height: 210px;
        border-left: 1px solid rgba(43, 42, 40, 0.25);
      }
      .mark svg { position: absolute; right: 0; bottom: 8px; width: 236px; height: 165px; }
      .footer {
        position: absolute;
        right: 58px;
        bottom: 38px;
        left: 58px;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #2b2a28;
        padding-top: 13px;
        color: #6b645e;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .domain { color: #0d7680; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">
        <span>Price of intelligence</span>
        <span>Independent open data</span>
      </div>
      <div class="masthead">The Marginal Token</div>
      <div class="main">
        <section>
          <p class="kicker">Frontier AI price tape</p>
          <h1>The price of intelligence,<br />marked to market.</h1>
        </section>
        <aside class="mark" aria-hidden="true">
          <svg viewBox="0 0 236 165" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 104L54 121L102 153L150 34" stroke="#990F3D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M150 34L229 78" stroke="#0D7680" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="150" cy="34" r="10" fill="#2B2A28" />
          </svg>
        </aside>
      </div>
      <div class="footer">
        <span>Model by model · million tokens at a time</span>
        <span class="domain">marginaltoken.com</span>
      </div>
    </main>
  </body>
</html>
